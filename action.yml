name: "site-encrypt"
description: "Encrypt marked static HTML content (AES-256-GCM + PBKDF2) after your SSG build"
branding:
  icon: "lock"
  color: "blue"

inputs:
  input:
    description: "Built site directory to process in place"
    default: "public"
  config:
    description: "Config file path (committed file holds no secrets; passwords come via env)"
    default: "encrypt.toml"
  dry-run:
    description: "'true' to scan and validate without writing files"
    default: "false"
  check:
    description: "'true' to only validate config + selectors (needs no passwords, ideal for PRs)"
    default: "false"
  version:
    description: "site-encrypt release to use (e.g. 'v0.1.0') or 'latest'"
    default: "latest"
  repo:
    description: "Override the repository to download releases from (for forks/mirrors). Empty = this action's own repository"
    default: ""
  github-token:
    description: "Token for api.github.com 'latest' lookup (avoids anonymous rate limits on shared runners)"
    default: ${{ github.token }}
  selector:
    description: "CSS selector for the node carrying the password alias (single-rule shortcut; used only when no config file is found)"
    default: ""
  content-selector:
    description: "CSS selector of the node whose children get encrypted (split-UI mode). Empty = self-contained mode"
    default: ""
  password-id-attribute:
    description: "Attribute holding the password alias. Empty = CLI default (data-password-key)"
    default: ""
  hint-attribute:
    description: "Attribute holding a password hint (self-contained mode only). Empty = none"
    default: ""
  iterations:
    description: "PBKDF2 iterations (>= 100000). Empty = CLI default (600000)"
    default: "600000"
  feeds-enabled:
    description: "'true' to redact feed entries linking to encrypted pages"
    default: "true"
  feed-placeholder:
    description: "Replacement text for redacted feed entries. Empty = CLI default"
    default: ""
  class-name:
    description: "CSS class prefix for the injected unlock form. Empty = CLI default"
    default: ""
  password-label:
    description: "Unlock form password label. Empty = CLI default"
    default: ""
  submit-label:
    description: "Unlock form submit label. Empty = CLI default"
    default: ""
  noscript-text:
    description: "Unlock form noscript text. Empty = CLI default"
    default: ""

outputs:
  config-path:
    description: "Config file actually used (the committed file, or the generated one)"
    value: ${{ steps.resolve.outputs.config-path }}

runs:
  using: "composite"
  steps:
    - name: Resolve config
      id: resolve
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SELECTOR: ${{ inputs.selector }}
        INPUT_CONTENT_SELECTOR: ${{ inputs.content-selector }}
        INPUT_PASSWORD_ID_ATTRIBUTE: ${{ inputs.password-id-attribute }}
        INPUT_HINT_ATTRIBUTE: ${{ inputs.hint-attribute }}
        INPUT_ITERATIONS: ${{ inputs.iterations }}
        INPUT_FEEDS_ENABLED: ${{ inputs.feeds-enabled }}
        INPUT_FEED_PLACEHOLDER: ${{ inputs.feed-placeholder }}
        INPUT_CLASS_NAME: ${{ inputs.class-name }}
        INPUT_PASSWORD_LABEL: ${{ inputs.password-label }}
        INPUT_SUBMIT_LABEL: ${{ inputs.submit-label }}
        INPUT_NOSCRIPT_TEXT: ${{ inputs.noscript-text }}
        SITE_ENCRYPT_PASSWORDS: ${{ env.SITE_ENCRYPT_PASSWORDS }}
      run: |
        set -euo pipefail
        if [ -f "$INPUT_CONFIG" ]; then
          echo "Using committed config '$INPUT_CONFIG' (rule/scalar inputs ignored)."
          echo "config-path=$INPUT_CONFIG" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$INPUT_CONFIG" != "encrypt.toml" ]; then
          echo "::error::config file '$INPUT_CONFIG' not found. Check the path, or omit 'config' to generate one from inputs."
          exit 1
        fi
        if [ -z "$INPUT_SELECTOR" ]; then
          echo "::error::no config file at 'encrypt.toml' and no 'selector' input given. Either commit an encrypt.toml, or set 'selector:' (+ 'content-selector:' for split-UI mode)."
          exit 1
        fi
        case "${INPUT_ITERATIONS:-}" in
          "") ;;
          *[!0-9]*) echo "::error::'iterations' must be a number, got '$INPUT_ITERATIONS'."; exit 1 ;;
        esac
        case "$INPUT_FEEDS_ENABLED" in
          true|false) ;;
          *) echo "::error::'feeds-enabled' must be 'true' or 'false', got '$INPUT_FEEDS_ENABLED'."; exit 1 ;;
        esac
        # TOML-escape backslashes and double quotes.
        esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
        OUT="$RUNNER_TEMP/site-encrypt-generated.toml"
        {
          echo "# Generated by the site-encrypt action from inputs (no secrets inside;"
          echo "# passwords come from SITE_ENCRYPT_PASSWORDS* env only)."
          echo ""
          echo "[[scanner.rules]]"
          echo "selector = \"$(esc "$INPUT_SELECTOR")\""
          [ -n "$INPUT_PASSWORD_ID_ATTRIBUTE" ] && echo "password_id_attribute = \"$(esc "$INPUT_PASSWORD_ID_ATTRIBUTE")\""
          [ -n "$INPUT_HINT_ATTRIBUTE" ] && echo "hint_attribute = \"$(esc "$INPUT_HINT_ATTRIBUTE")\""
          [ -n "$INPUT_CONTENT_SELECTOR" ] && echo "content_selector = \"$(esc "$INPUT_CONTENT_SELECTOR")\""
          echo ""
          echo "[encryption]"
          [ -n "${INPUT_ITERATIONS:-}" ] && echo "iterations = $INPUT_ITERATIONS"
          echo ""
          echo "[feeds]"
          echo "enabled = $INPUT_FEEDS_ENABLED"
          [ -n "$INPUT_FEED_PLACEHOLDER" ] && echo "placeholder = \"$(esc "$INPUT_FEED_PLACEHOLDER")\""
          if [ -n "$INPUT_CLASS_NAME" ] || [ -n "$INPUT_PASSWORD_LABEL" ] || [ -n "$INPUT_SUBMIT_LABEL" ] || [ -n "$INPUT_NOSCRIPT_TEXT" ]; then
            echo ""
            echo "[output]"
            [ -n "$INPUT_CLASS_NAME" ] && echo "class_name = \"$(esc "$INPUT_CLASS_NAME")\""
            if [ -n "$INPUT_PASSWORD_LABEL" ] || [ -n "$INPUT_SUBMIT_LABEL" ] || [ -n "$INPUT_NOSCRIPT_TEXT" ]; then
              echo ""
              echo "[output.ui]"
              [ -n "$INPUT_PASSWORD_LABEL" ] && echo "password_label = \"$(esc "$INPUT_PASSWORD_LABEL")\""
              [ -n "$INPUT_SUBMIT_LABEL" ] && echo "submit_label = \"$(esc "$INPUT_SUBMIT_LABEL")\""
              [ -n "$INPUT_NOSCRIPT_TEXT" ] && echo "noscript_text = \"$(esc "$INPUT_NOSCRIPT_TEXT")\""
            fi
          fi
          echo ""
          echo "# Passwords come from SITE_ENCRYPT_PASSWORDS* env only."
          echo "[passwords]"
          if [ -n "${SITE_ENCRYPT_PASSWORDS:-}" ]; then
            printf '%s\n' "$SITE_ENCRYPT_PASSWORDS"
          fi
        } > "$OUT"
        echo "Generated config from inputs:"
        sed '/^\[passwords\]/,$ s/=.*$/= "***"/' "$OUT"
        echo "config-path=$OUT" >> "$GITHUB_OUTPUT"
    - name: Install site-encrypt
      shell: bash
      env:
        # NOTE: github.action_repository is EMPTY inside a composite run:
        # script (actions/runner#2473) but resolves fine via env:.
        ACTION_REPO: ${{ github.action_repository }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        REPO="${INPUT_REPO:-$ACTION_REPO}"
        if [ -z "$REPO" ]; then
          echo "::error::cannot determine the action repository; set the 'repo' input (owner/name)"
          exit 1
        fi
        VERSION="$INPUT_VERSION"
        if [ "$VERSION" = "latest" ]; then
          VERSION="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/latest" \
            | grep '"tag_name"' | cut -d'"' -f4)"
          echo "Resolved latest version: $VERSION"
        fi
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   TARGET="x86_64-unknown-linux-gnu" ;;
          Windows-X64) TARGET="x86_64-pc-windows-msvc" ;;
          macOS-ARM64) TARGET="aarch64-apple-darwin" ;;
          *) echo "::error::unsupported platform ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/site-encrypt-bin"
        curl -fsSL "https://github.com/$REPO/releases/download/$VERSION/site-encrypt-$TARGET.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP/site-encrypt-bin"
        echo "$RUNNER_TEMP/site-encrypt-bin" >> "$GITHUB_PATH"

    - name: Encrypt site
      shell: bash
      run: |
        set -euo pipefail
        args=(--config "${{ steps.resolve.outputs.config-path }}" --input "${{ inputs.input }}")
        if [ "${{ inputs.dry-run }}" = "true" ]; then args+=(--dry-run); fi
        if [ "${{ inputs.check }}" = "true" ]; then args+=(--check); fi
        echo "Generated config:"
        sed '/\[passwords\]/,$ s/=.*/= "***"/' \
          /home/runner/work/_temp/site-encrypt-generated.toml
        site-encrypt "${args[@]}"
