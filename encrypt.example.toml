# ssg-encrypt configuration example (minimal)
# Copy this file to encrypt.toml and adjust. encrypt.toml is git-ignored —
# never commit real passwords. On CI, leave [passwords] empty and provide
# passwords via env vars instead (see README):
#   SITE_ENCRYPT_PASSWORDS_BLOG=${{ secrets.BLOG_PASSWORD }}

# Encryption rules. A page can have multiple rules; each rule finds the
# node carrying the password alias and encrypts content for it.
[[scanner.rules]]
# CSS selector for the node carrying the password alias.
selector = "#encryptedBox"
# Attribute holding the alias. Default is "data-password-key"; override
# only if your markup genuinely needs a different attribute name.
# password_id_attribute = "data-password-key"

# --- Split-UI mode (recommended) ---
# Encrypt the children of THAT node; the payload lands on the matched node
# above. No unlock UI is injected — your theme provides its own.
content_selector = "#articleContent"

# --- Self-contained mode (alternative) ---
# Omit content_selector: the matched node's own children are encrypted and
# a generic unlock form is injected in their place.
# Optional: hint_attribute names an attribute holding a password hint.
# hint_attribute = "data-hint"

# A second rule would look like this:
# [[scanner.rules]]
# selector = ".locked-post"
# content_selector = ".post-body"

[encryption]
# PBKDF2 iterations. Minimum 100 000 (enforced). Only increase.
# Overridable via SITE_ENCRYPT_ITERATIONS.
iterations = 600000

[feeds]
# Redact Atom/RSS entries that link to encrypted pages.
enabled = true
# Replacement text for encrypted feed entries.
# Overridable via SITE_ENCRYPT_FEED_PLACEHOLDER.
placeholder = "本文已加密，前往原文解锁后阅读。"

# Map password aliases to real passwords. Aliases appear in your HTML;
# real passwords live ONLY here (local dev) or in env vars (CI):
# bulk (one secret, many passwords) via SITE_ENCRYPT_PASSWORDS, or
# one var per password via SITE_ENCRYPT_PASSWORDS_<ALIAS> (wins on conflict).
[passwords]
blog = "replace-this"
# private = "another-password"
