name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - shell: bash
        run: |
          set -euo pipefail
          BIN="site-encrypt"
          [ "$RUNNER_OS" = "Windows" ] && BIN="site-encrypt.exe"
          tar -czf "site-encrypt-${{ matrix.target }}.tar.gz" -C target/release "$BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: site-encrypt-${{ matrix.target }}
          path: site-encrypt-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/site-encrypt-*.tar.gz
          generate_release_notes: true
